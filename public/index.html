<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GGC Neonatal Monographs & Guidelines</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/minisearch@7.1.0/dist/umd/index.min.js"></script>
  <style>
    mark {
      background-color: #fef08a;
      color: #854d0e;
      font-weight: 600;
      padding: 0 2px;
      border-radius: 2px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

  <!-- Sticky Header & Search Controls -->
  <header class="sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1 mb-3">
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-blue-600 text-white font-bold text-sm">Rx</span>
          <h1 class="text-lg font-bold tracking-tight text-slate-900">GGC Neonatal Monographs & Guidelines</h1>
        </div>
        <span id="sync-status" class="text-xs text-slate-500">Loading index...</span>
      </div>

      <!-- Search Bar -->
      <div class="relative">
        <input
          id="search-input"
          type="search"
          autocomplete="off"
          placeholder="Search guideline, drug name, compatibility (e.g. 'respiratory distress', 'gentamicin trough', 'dobutamine')..."
          class="w-full pl-10 pr-20 py-2.5 bg-slate-100 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition"
        />
        <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <button
          id="clear-btn"
          class="hidden absolute right-2.5 top-2 px-2 py-0.5 text-xs font-medium text-slate-600 bg-slate-200 hover:bg-slate-300 rounded-md"
        >
          ESC / Clear
        </button>
      </div>

      <!-- Filter Pills & Result Count -->
      <div class="flex flex-wrap items-center justify-between gap-2 mt-3">
        <div class="flex flex-wrap gap-1.5" id="category-filters">
          <button data-cat="ALL" class="cat-btn active px-3 py-1 rounded-full text-xs font-semibold bg-blue-600 text-white transition">All</button>
          <button data-cat="Clinical Guideline" class="cat-btn px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 transition">Guidelines</button>
          <button data-cat="Parenteral" class="cat-btn px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 transition">IV Monographs</button>
          <button data-cat="Oral & Other" class="cat-btn px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 transition">Oral / Other</button>
        </div>
        <span id="result-count" class="text-xs font-medium text-slate-500"></span>
      </div>
    </div>
  </header>

  <!-- Main Results List -->
  <main class="max-w-4xl mx-auto px-4 py-5">
    <div id="results-container" class="space-y-2.5"></div>
  </main>

  <script>
    let allDocuments = [];
    let docMap = new Map();
    let miniSearch = null;
    let activeCategory = "ALL";

    const searchInput = document.getElementById("search-input");
    const clearBtn = document.getElementById("clear-btn");
    const resultsContainer = document.getElementById("results-container");
    const resultCount = document.getElementById("result-count");
    const syncStatus = document.getElementById("sync-status");

    // 1. Initialize MiniSearch and Load JSON Index
    async function init() {
      try {
        const res = await fetch("./search_index.json");
        if (!res.ok) throw new Error("Could not load search_index.json");
        const data = await res.json();

        allDocuments = (data.documents || []).sort((a, b) => a.title.localeCompare(b.title));
        allDocuments.forEach(doc => docMap.set(doc.id, doc));

        const syncDate = data.lastSynced ? new Date(data.lastSynced).toLocaleDateString("en-GB", {
          day: "2-digit", month: "short", year: "numeric"
        }) : "Unknown";
        syncStatus.textContent = `${allDocuments.length} docs indexed • Synced ${syncDate}`;

        miniSearch = new MiniSearch({
          fields: ["title", "linkText", "category", "content"],
          storeFields: ["id"],
          searchOptions: {
            boost: { title: 4, linkText: 2.5, category: 1.5, content: 1 },
            prefix: true,
            fuzzy: term => term.length > 4 ? 0.2 : false,
            combineWith: "AND"
          }
        });

        miniSearch.addAll(allDocuments);
        renderResults();
      } catch (err) {
        syncStatus.textContent = "Index load failed";
        resultsContainer.innerHTML = `
          <div class="p-4 bg-red-50 border border-red-200 rounded-xl text-sm text-red-700">
            <strong>Unable to load <code>search_index.json</code>.</strong> Run <code>python sync_monographs.py</code> first and serve the <code>./public</code> folder over a local web server.
          </div>`;
      }
    }

    // 2. Build Context Snippet with Highlighted Terms & Page Number
    function buildSnippet(content, rawQuery) {
      if (!content || !rawQuery.trim()) return "";
      const terms = rawQuery.trim().toLowerCase().split(/\s+/).filter(t => t.length >= 2);
      if (!terms.length) return "";

      const lowerContent = content.toLowerCase();
      let firstMatchIdx = -1;

      for (const term of terms) {
        const idx = lowerContent.indexOf(term);
        if (idx !== -1 && (firstMatchIdx === -1 || idx < firstMatchIdx)) {
          firstMatchIdx = idx;
        }
      }

      if (firstMatchIdx === -1) {
        for (const term of terms) {
          if (term.length >= 4) {
            const idx = lowerContent.indexOf(term.slice(0, 4));
            if (idx !== -1) { firstMatchIdx = idx; break; }
          }
        }
      }

      if (firstMatchIdx === -1) return "";

      const precedingText = content.slice(0, firstMatchIdx);
      const pageMatches = [...precedingText.matchAll(/\[Page\s+(\d+)\]/g)];
      const pageLabel = pageMatches.length ? `Page ${pageMatches[pageMatches.length - 1][1]}` : "";

      const start = Math.max(0, firstMatchIdx - 80);
      const end = Math.min(content.length, firstMatchIdx + 180);
      let snippet = content.slice(start, end).replace(/\s+/g, " ").trim();

      snippet = snippet.replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

      terms.forEach(term => {
        const cleanTerm = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const pattern = cleanTerm.length >= 5 ? `${cleanTerm.slice(0, 4)}\\w*` : cleanTerm;
        const regex = new RegExp(`(${pattern})`, "gi");
        snippet = snippet.replace(regex, "<mark>$1</mark>");
      });

      return `
        <div class="mt-2 p-2.5 bg-slate-50 border border-slate-200/80 rounded-lg text-xs text-slate-600 leading-relaxed">
          ${pageLabel ? `<span class="inline-block font-semibold text-blue-700 mr-1.5">[${pageLabel}]</span>` : ""}
          …${snippet}…
        </div>`;
    }

    function isReviewOverdue(dateStr) {
      if (!dateStr) return false;
      const parts = dateStr.split("/");
      if (parts.length !== 3) return false;
      const reviewDate = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
      return reviewDate < new Date();
    }

    // 3. Filter & Render Cards
    function renderResults() {
      const query = searchInput.value.trim();
      clearBtn.classList.toggle("hidden", query.length === 0);

      let matchedDocs = [];
      if (!query) {
        matchedDocs = allDocuments;
      } else {
        let searchHits = miniSearch.search(query);
        if (searchHits.length === 0 && query.includes(" ")) {
          searchHits = miniSearch.search(query, { combineWith: "OR" });
        }
        matchedDocs = searchHits.map(hit => docMap.get(hit.id)).filter(Boolean);
      }

      if (activeCategory !== "ALL") {
        matchedDocs = matchedDocs.filter(d => d.category === activeCategory);
      }

      resultCount.textContent = `${matchedDocs.length} result${matchedDocs.length === 1 ? "" : "s"}`;

      if (matchedDocs.length === 0) {
        resultsContainer.innerHTML = `
          <div class="text-center py-12 text-slate-500 text-sm">
            No monographs or guidelines matched "<strong>${query}</strong>".
          </div>`;
        return;
      }

      resultsContainer.innerHTML = matchedDocs.map(doc => {
        const badgeStyles = doc.category === "Parenteral"
          ? "bg-rose-100 text-rose-800 border-rose-200"
          : doc.category === "Oral & Other"
          ? "bg-emerald-100 text-emerald-800 border-emerald-200"
          : "bg-indigo-100 text-indigo-800 border-indigo-200";

        const overdue = isReviewOverdue(doc.nextReview);
        const primaryHref = doc.localPdfPath ? `.${doc.localPdfPath}` : (doc.remotePdfUrl || doc.sourcePageUrl);
        const snippetHtml = query ? buildSnippet(doc.content, query) : "";

        return `
          <article class="bg-white border border-slate-200 rounded-xl p-3.5 shadow-sm hover:border-blue-300 transition">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0 flex-1">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="px-2 py-0.5 text-[11px] font-semibold border rounded-md ${badgeStyles}">
                    ${doc.category}
                  </span>
                  <h2 class="text-sm sm:text-base font-bold text-slate-900 truncate">
                    <a href="${primaryHref}" target="_blank" rel="noopener" class="hover:text-blue-600 hover:underline">
                      ${doc.title}
                    </a>
                  </h2>
                </div>

                <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mt-1 text-xs text-slate-500">
                  ${doc.lastReviewed ? `<span>Reviewed: ${doc.lastReviewed}</span>` : ""}
                  ${doc.nextReview ? `
                    <span class="${overdue ? "text-amber-700 font-semibold" : ""}">
                      Next Review: ${doc.nextReview} ${overdue ? "(Due)" : ""}
                    </span>` : ""}
                  <a href="${doc.sourcePageUrl}" target="_blank" rel="noopener" class="text-slate-400 hover:text-slate-600 underline">
                    GGC Source Page ↗
                  </a>
                </div>
              </div>

              <!-- Direct 1-Click PDF Action -->
              <div class="flex items-center gap-1.5 shrink-0">
                ${doc.local
